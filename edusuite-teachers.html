<style>

  :root{

    --success-600:#16A34A; --success-50:#ECFDF3;
    --warning-600:#D97706; --warning-50:#FFFBEB;
    --danger-600:#DC2626; --danger-50:#FEF2F2;
    --slate-600:#64748B; --slate-50:#F1F5F9;
    --surface:#FFFFFF; --bg:#F6F7FB; --border:#E6E9F0;
    --text-900:#0F172A; --text-600:#5B6472; --text-400:#94A0B2;
    --radius-md:10px; --radius-lg:14px;
    --shadow-sm:0 1px 2px rgba(15,23,42,.04);
    --shadow-md:0 8px 30px rgba(15,23,42,.12);
    --font-en:'Merriweather', serif; --font-ar:'Merriweather', 'Tajawal', serif;
  }
  [data-theme="dark"]{
    --surface:#111827; --bg:#0B1220; --border:#1F2937;
    --text-900:#F1F5F9; --text-600:#9AA5B4; --text-400:#6B7686;
    --indigo-50:#1E1B4B; --success-50:#052E1B; --warning-50:#3A2A04; --danger-50:#3A0D0D; --slate-50:#1E293B;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 8px 30px rgba(0,0,0,.5);

  *{box-sizing:border-box; margin:0; padding:0;}

  html[dir="rtl"] body{ font-family:var(--font-ar); }
  a{ text-decoration:none; color:inherit; } button{ font-family:inherit; cursor:pointer; border:none; }
  .app{ display:flex; min-height:100vh; }

  .brand{ display:flex; align-items:center; gap:10px; padding:20px 18px; border-bottom:1px solid var(--border); }
  .brand-logo{ position:relative; width:34px; height:34px; border-radius:50%; flex-shrink:0; background:var(--navy-800); overflow:hidden; border:2px solid var(--indigo-50); display:flex; align-items:center; justify-content:center; }
  .brand-logo img{ width:100%; height:100%; object-fit:cover; display:none; }
  .brand-logo-fallback{ color:#fff; font-weight:800; font-size:13px; }

  .nav-item{ display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:9px; color:var(--text-600); font-size:13.5px; font-weight:500; margin-bottom:1px; white-space:nowrap; }

  .sidebar-footer{ padding:12px; border-top:1px solid var(--border); display:flex; align-items:center; gap:9px; }

  .content{ padding:24px 28px 60px; max-width:1400px; }

  .page-head p{ color:var(--text-600); font-size:13.5px; margin-top:3px; }
  .btn{ display:inline-flex; align-items:center; gap:7px; padding:0 16px; height:38px; border-radius:9px; font-size:13.5px; font-weight:700; }
  .btn-primary{ background:var(--indigo-600); color:#fff; } .btn-primary:hover{ background:#4338CA; }
  .btn-outline{ background:var(--surface); border:1px solid var(--border); color:var(--text-600); } .btn-outline:hover{ background:var(--bg); }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); }

  .stat-strip{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:18px; }
  .stat-card{ padding:16px 18px; display:flex; align-items:center; gap:12px; }
  .stat-icon{ width:38px; height:38px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .icon-blue{ background:#EAF1FF; color:#2563EB; } .icon-green{ background:var(--success-50); color:var(--success-600); }
  .icon-amber{ background:var(--warning-50); color:var(--warning-600); } .icon-red{ background:var(--danger-50); color:var(--danger-600); }
  .stat-label{ font-size:12px; color:var(--text-600); font-weight:600; } .stat-value{ font-size:19px; font-weight:800; }

  .toolbar{ display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .search-box{ position:relative; flex:1; min-width:220px; max-width:320px; }

  .filter-chip{ display:flex; align-items:center; gap:6px; height:38px; padding:0 12px; border-radius:9px; border:1px solid var(--border); background:var(--surface); font-size:13px; font-weight:600; color:var(--text-600); }
  .filter-chip.on{ background:var(--indigo-50); border-color:var(--indigo-600); color:var(--indigo-600); }
  .toolbar-right{ margin-inline-start:auto; }

  table{ width:100%; border-collapse:collapse; }
  thead th{ text-align:start; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--text-400); padding:12px 18px; border-bottom:1px solid var(--border); white-space:nowrap; }
  tbody td{ padding:13px 18px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; }

  .book-title{ font-weight:700; } .book-sub{ font-size:11.5px; color:var(--text-400); }
  .badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:700; }
  .badge-success{ background:var(--success-50); color:var(--success-600); }
  .badge-warning{ background:var(--warning-50); color:var(--warning-600); }
  .badge-danger{ background:var(--danger-50); color:var(--danger-600); }
  .avail-pill{ font-size:12.5px; }
  .avail-pill b{ color:var(--text-900); }
  .row-actions{ display:flex; align-items:center; gap:4px; }
  .icon-btn-sm{ width:28px; height:28px; border-radius:7px; border:1px solid transparent; background:transparent; display:flex; align-items:center; justify-content:center; color:var(--text-400); }
  .icon-btn-sm:hover{ background:var(--bg); color:var(--text-900); border-color:var(--border); }
  .btn-mini{ height:28px; padding:0 10px; border-radius:7px; font-size:11.5px; font-weight:700; border:1px solid var(--border); background:var(--surface); color:var(--text-600); }
  .btn-mini:hover{ background:var(--bg); }
  .btn-mini.disabled{ opacity:.45; cursor:not-allowed; }

  .pagination{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px; font-size:12.5px; color:var(--text-600); flex-wrap:wrap; gap:10px; }
  .page-btns{ display:flex; align-items:center; gap:4px; }
  .page-btn{ width:30px; height:30px; border-radius:7px; border:1px solid var(--border); background:var(--surface); font-size:12.5px; font-weight:600; color:var(--text-600); }
  .page-btn.active{ background:var(--indigo-600); border-color:var(--indigo-600); color:#fff; }

  .overlay{ position:fixed; inset:0; background:rgba(11,18,32,.5); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .overlay.show{ display:flex; }
  .modal{ background:var(--surface); border-radius:var(--radius-lg); width:100%; max-width:520px; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-md); }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--border); }
  .modal-head h3{ font-size:15.5px; font-weight:700; }
  .modal-body{ padding:20px; display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .field{ display:flex; flex-direction:column; gap:6px; } .field.full{ grid-column:1/-1; }
  .field label{ font-size:12.5px; font-weight:700; color:var(--text-600); }
  .field input, .field select{ height:38px; border-radius:9px; border:1px solid var(--border); background:var(--bg); padding:0 12px; font-size:13.5px; color:var(--text-900); font-family:inherit; }
  .field input:focus, .field select:focus{ outline:2px solid var(--indigo-500); outline-offset:1px; background:var(--surface); }
  .field .err{ font-size:11px; color:var(--danger-600); display:none; }
  .field.invalid input{ border-color:var(--danger-600); }
  .field.invalid .err{ display:block; }
  .modal-foot{ display:flex; justify-content:flex-end; gap:10px; padding:16px 20px; border-top:1px solid var(--border); }

  .empty-state{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; text-align:center; color:var(--text-400); }
  .toast-wrap{ position:fixed; bottom:20px; inset-inline-end:20px; z-index:60; }
  .toast{ display:flex; align-items:center; gap:10px; background:var(--navy-800); color:#fff; padding:12px 16px; border-radius:10px; font-size:13px; font-weight:600; box-shadow:var(--shadow-md); }

  @media (max-width:900px){ .stat-strip{ grid-template-columns:1fr 1fr; } .modal-body{ grid-template-columns:1fr; } table{ min-width:720px; } .card{ overflow-x:auto; } }
  @media (max-width:760px){ .sidebar{ display:none; } .content{ padding:16px; } }
</style>
</head>

function showToast(msg){
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div'); t.className='toast';
  t.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg><span>${msg}</span>`;
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(), 300); }, 2800);
}

function applyLang(lang){
  state.lang = lang;
  localStorage.setItem('edunova-lang', lang);
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==='ar' ? 'rtl':'ltr';
  document.querySelectorAll('[data-en]').forEach(el=>{
    const v = lang==='ar' ? el.getAttribute('data-ar') : el.getAttribute('data-en');
    if(v!==null) el.textContent = v;
  });
  document.querySelectorAll('[data-ph-en]').forEach(el=>{ el.placeholder = lang==='ar' ? el.getAttribute('data-ph-ar') : el.getAttribute('data-ph-en'); });
  document.getElementById('langToggle').textContent = lang==='ar' ? 'English' : 'العربية';
}
document.getElementById('langToggle').addEventListener('click', ()=> applyLang(state.lang==='en'?'ar':'en'));

function applyTheme(theme){
  state.theme = theme;
  localStorage.setItem('edunova-theme', theme);
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeToggle');
  btn.setAttribute('data-en', theme==='dark'?'Light':'Dark');
  btn.setAttribute('data-ar', theme==='dark'?'فاتح':'داكن');
  btn.textContent = state.lang==='ar' ? btn.getAttribute('data-ar') : btn.getAttribute('data-en');
}
document.getElementById('themeToggle').addEventListener('click', ()=> applyTheme(state.theme==='light'?'dark':'light'));

applyTheme(state.theme);
applyLang(state.lang);
</script>
